    @media (prefers-reduced-motion: reduce) {

          const [targetMin, targetMax] = ageRanges[state.libraryOption] || [3, 6];
          result = result.filter((book) => {
            const [min, max] = book.age.split(/[–-]/).map((value) => Number(value.replace(/\D/g, "")));

          result = result.filter((book) => {
            if (state.libraryOption === "5 分钟以内") return book.minutes <= 5;
            if (state.libraryOption === "5–10 分钟") return book.minutes > 5 && book.minutes <= 10;
            return book.minutes > 10;
          });
        } else if (state.libraryCategory === "绘本特色" && state.libraryOption) {
          result = result.filter((book) => book.features.includes(state.libraryOption));
        } else if (state.libraryCategory === "阅读场景" && state.libraryOption) {
          result = result.filter((book) => book.scenes.includes(state.libraryOption));
        }
        return result;
      }

      function libraryPage() {
        const visible = filteredBooks();
        const selected = visible.find((book) => book.id === state.selectedBookId) || visible[0] || null;
        if (selected) state.selectedBookId = selected.id;
        const categories = ["全部", "年龄", "主题", "阅读时长", "绘本特色", "阅读场景"];
        const options = state.libraryCategory === "全部" ? [] : (libraryFilterOptions[state.libraryCategory] || []);
        return `
          ${header("library")}
          <main class="page page-width library-page">
            <div class="library-content">
              <div class="library-top-row">
                <aside class="library-filter-panel ${state.libraryCategory !== "全部" ? "expanded" : ""}" aria-labelledby="library-title">
                  <h2 id="library-title">绘本馆</h2>
                  <p>发现适合孩子的每一本好故事</p>
                  <div class="library-category-rows">
                    <div class="library-category-row">
                      ${categories.slice(0, 4).map((category) => `
                        <button class="library-category-chip ${state.libraryCategory === category ? "active" : ""}" type="button" data-action="library-category" data-value="${category}" aria-expanded="${category !== "全部" && state.libraryCategory === category}">${category}</button>`).join("")}
                    </div>
                    <div class="library-category-row">
                      ${categories.slice(4).map((category) => `
                        <button class="library-category-chip ${state.libraryCategory === category ? "active" : ""}" type="button" data-action="library-category" data-value="${category}" aria-expanded="${category !== "全部" && state.libraryCategory === category}">${category}</button>`).join("")}
                    </div>
                  </div>
                  ${options.length ? `
                    <div class="library-filter-expand">
                      <strong>${escapeHtml(state.libraryCategory)}：选择具体条件</strong>
                      <div class="library-option-list">
                        ${["全部", ...options].map((option) => `
                          <button class="library-option-chip ${(option === "全部" ? !state.libraryOption : state.libraryOption === option) ? "active" : ""}" type="button" data-action="library-option" data-value="${option}">${option}</button>`).join("")}
                      </div>
                    </div>` : ""}
                </aside>
                ${state.libraryLoading ? `
                  <div class="library-feature-card"><div class="library-feature-cover skeleton"></div><div><div class="skeleton" style="height:22px;width:46%"></div><div class="skeleton" style="height:38px;width:68%;margin-top:13px"></div><div class="skeleton" style="height:18px;width:54%;margin-top:12px"></div><div class="skeleton" style="height:56px;margin-top:16px"></div></div></div>` :
                  selected ? `
                    <article class="library-feature-card">
                      <div class="library-feature-cover">${coverImage(selected)}</div>
                      <div class="library-feature-copy">
                        <span class="pill">${selected.status} · 亲子共读</span>
                        <h2>${escapeHtml(selected.title)}</h2>
                        <p>${escapeHtml(selected.author)} · ${selected.age} · ${selected.pages} 页 · 约 ${selected.minutes} 分钟</p>
                        <div class="reason-box"><strong>为什么推荐：</strong>${escapeHtml(selected.summary)}</div>
                        <div class="feature-actions">
                          <button class="primary" type="button" data-action="open-detail" data-id="${selected.id}">查看详情</button>
                          <button class="secondary" type="button" data-action="toggle-favorite" data-id="${selected.id}">${state.favorites.includes(selected.id) ? "已加入书架" : "加入书架"}</button>
                        </div>
                      </div>
                    </article>` : `
                    <div class="empty-state"><div><h2>没有找到符合条件的绘本</h2><p>可以切换筛选条件，或查看全部绘本。</p><button class="primary" type="button" data-action="clear-library">查看全部绘本</button></div></div>`}
              </div>
              ${state.libraryLoading ? "" : visible.length ? `
                <section class="library-stage" aria-label="绘本轮播">
                    <div class="book-wheel-panel">
                      <div class="book-wheel">
                        ${visible.map((book, index) => `
                          <button class="wheel-book ${book.id === selected?.id ? "selected" : ""}" type="button" data-action="select-book" data-id="${book.id}" data-index="${index}" aria-current="${book.id === selected?.id ? "true" : "false"}" aria-label="选择《${escapeHtml(book.title)}》">
                            <span class="wheel-book-shell">
                              <img class="book-shell" src="${assets.bookShell}" alt="">
                              <span class="wheel-cover">${coverImage(book)}</span>
                            </span>
                          </button>`).join("")}
                      </div>
                      <div class="carousel-dots" aria-label="绘本位置">
                        ${visible.map((book) => `
                          <button class="carousel-dot ${book.id === selected?.id ? "active" : ""}" type="button" data-action="select-book" data-id="${book.id}" aria-label="切换到《${escapeHtml(book.title)}》" aria-current="${book.id === selected?.id ? "true" : "false"}"></button>`).join("")}
                      </div>
                      <div class="wheel-controls">
                        <button class="round-button" type="button" data-action="wheel-prev" aria-label="切换到上一本">‹</button>
                        <button class="round-button" type="button" data-action="wheel-next" aria-label="切换到下一本">›</button>
                      </div>
                    </div>
                </section>` : ""}
            </div>
          </main>`;
      }

      function detailPage() {
        const book = currentBook();
        return `
          ${header("detail")}
          <main class="detail-page page-width">
            <div class="detail-toolbar">
              <button class="secondary" type="button" data-action="go" data-view="library">← 返回绘本馆</button>
              <span class="detail-breadcrumb">绘本馆 / ${escapeHtml(book.topics[0])} / ${escapeHtml(book.title)}</span>
            </div>
            <article class="detail-card">
              <div class="detail-cover-wrap"><div class="detail-cover">${coverImage(book)}</div></div>
              <div class="detail-copy">
                <span class="pill">${book.status} · 亲子共读</span>
                <h1>${escapeHtml(book.title)}</h1>
                <p class="detail-author">作者：${escapeHtml(book.author)}</p>
                <div class="book-meta"><span>${book.age}</span><span>${book.pages} 页</span><span>约 ${book.minutes} 分钟</span><span>${escapeHtml(book.topics.join(" · "))}</span></div>
                <p class="detail-summary">${escapeHtml(book.summary)}</p>
                <blockquote class="detail-quote">${escapeHtml(book.quote)}</blockquote>
                <div class="detail-actions">
                  <button class="primary" type="button" data-action="start-reading" data-id="${book.id}">开始阅读</button>
                  <button class="secondary" type="button" data-action="toggle-favorite" data-id="${book.id}">${state.favorites.includes(book.id) ? "已加入书架" : "加入书架"}</button>
                </div>
              </div>
            </article>
          </main>`;
      }

      function readerAudioNotice(page) {
        if (state.reader.audio === "idle") return "";
        const message = state.reader.audio === "playing"
          ? `正在朗读第 ${page.no} 页`
          : state.reader.audio === "paused"
            ? "朗读已暂停"
            : "朗读暂时无法播放，文字仍可阅读";
        return `<div class="side-card audio"><div class="audio-line"><span>${message}</span><button type="button" data-action="narration">${state.reader.audio === "playing" ? "暂停" : "继续"}</button></div></div>`;
      }

      function readerFeedbackNotice() {
        if (!state.reader.feedback) return "";
        return `<div class="reason-box">${state.reader.feedback === "understood" ? "继续追问：如果你是小主人公，你还会怎么选择？" : "一起看画面：先说出现在画面里的人物和动作，再慢慢回答。"}</div>`;
      }

      function readerPage() {
        const book = currentBook();
        const storyPages = pagesFor(book);
        const pageIndex = Math.min(state.reader.pageIndex, storyPages.length - 1);
        const page = storyPages[pageIndex];
        return `
          ${header("reader")}
          <main class="reader-page page-width">
            <div class="reader-heading">
              <div>
                <button class="text-button" type="button" data-action="open-detail" data-id="${book.id}">← 返回绘本详情</button>
                <h1>${escapeHtml(book.title)}</h1>
                <p data-reader-progress>第 ${page.no} / ${book.pages} 页 · 与孩子一起慢慢读</p>
              </div>
              <span class="pill">${state.reader.completed ? "本次阅读已完成" : "亲子共读模式"}</span>
            </div>
            <div class="reader-layout">
              <section class="reader-main">
                ${state.reader.loading ? `<div class="reader-loading"><div><div class="spinner" style="margin:0 auto 12px"></div><p>正在翻开这一页…</p></div></div>` : `
                  <div class="flipbook-stage">
                    <div class="flipbook-book" id="zhiya-flipbook" aria-label="${escapeHtml(book.title)}软页绘本">
                      ${storyPages.map((storyPage, index) => `
                        <section class="flip-page flip-page--illustration" data-density="soft" aria-label="第 ${storyPage.no} 页插图">
                          ${state.readerImageError
                            ? `<div class="flip-page-empty"><div class="empty-state"><div><h2>插图暂时无法显示</h2><p>文字内容仍可继续阅读。</p><button class="secondary" type="button" data-action="retry-image">重新加载</button></div></div></div>`
                            : `<img src="${book.cover}" alt="${escapeHtml(storyPage.illustrationText)}" draggable="false" onerror="window.__zhiyaImageError && window.__zhiyaImageError()">`}
                        </section>
                        <section class="flip-page flip-page--text" data-density="soft" aria-label="第 ${storyPage.no} 页文字">
                          <div class="flip-page-inner flip-page-inner--text">
                            <p class="eyebrow">${escapeHtml(book.title)} · 第 ${storyPage.no} 页</p>
                            <blockquote class="page-quote">${escapeHtml(book.quote)}</blockquote>
                            <p class="page-text">${escapeHtml(storyPage.text)}</p>
                            <div class="page-number"><span>第 ${storyPage.no} 页 · 共 ${book.pages} 页</span><span class="page-dots">${storyPages.map((_, dotIndex) => `<i class="${dotIndex === index ? "active" : ""}"></i>`).join("")}</span></div>
                          </div>
                        </section>`).join("")}
                    </div>
                    <p class="flip-hint">拖动书页边缘，或点击外侧翻页</p>
                  </div>`}
                <nav class="reader-dock" aria-label="阅读控制">
                  <button class="dock-button" type="button" data-action="prev-page" data-reader-prev ${pageIndex === 0 ? "disabled" : ""}><span class="dock-glyph">‹</span>上一页</button>
                  <button class="dock-button" type="button" data-action="narration"><span class="dock-glyph">${state.reader.audio === "playing" ? "Ⅱ" : "▶"}</span>${state.reader.audio === "playing" ? "暂停朗读" : "朗读"}</button>
                  <button class="dock-button primary" type="button" data-action="open-voice"><span class="dock-glyph">芽</span>问知芽</button>
                  <button class="dock-button" type="button" data-action="${pageIndex >= storyPages.length - 1 ? "finish-reading" : "next-page"}" data-reader-next><span class="dock-glyph">${pageIndex >= storyPages.length - 1 ? "✓" : "›"}</span>${pageIndex >= storyPages.length - 1 ? "完成" : "下一页"}</button>
                </nav>
              </section>
              <aside class="reader-side">
                <div data-reader-audio-slot>${readerAudioNotice(page)}</div>
                <section class="side-card question-card">
                  <h2>✦ 共读小提问</h2>
                  <p data-reader-question>${escapeHtml(page.question)}</p>
                  <div class="question-actions">
                    <button class="secondary" type="button" data-action="reader-feedback" data-value="understood">已理解</button>
                    <button class="secondary" type="button" data-action="reader-feedback" data-value="not-understood">还没懂</button>
                    <button class="primary" type="button" data-action="open-voice">孩子来回答</button>
                  </div>
                  <div data-reader-feedback-slot>${readerFeedbackNotice()}</div>
                </section>
                <section class="side-card parent-tip"><h2>给家长的共读提示</h2><p data-reader-tip>${escapeHtml(page.answer)}</p></section>
                ${state.reader.completed ? `<section class="side-card"><h2>本次共读完成</h2><p class="address">阅读记录已保存在本机，本次共读页数和互动次数可用于生成阅读小结。</p><button class="primary" type="button" data-action="go" data-view="account" data-section="growth">查看成长记录</button></section>` : ""}
              </aside>
            </div>
          </main>
          ${state.voice.open ? voiceModal(page) : ""}`;
      }

      function voiceProgress(stage) {
        const order = ["idle", "recording", "processing", "confirm", "answer"];
        const index = Math.max(0, order.indexOf(stage));
        return `<div class="voice-progress"><span class="${index >= 1 ? "done" : "active"}">录音</span><span class="${index >= 3 ? "done" : index >= 2 ? "active" : ""}">识别</span><span class="${index >= 4 ? "active" : ""}">回答</span></div>`;
      }

      function voiceModal(page) {
        let body = "";
        if (state.voice.stage === "idle") {
          body = `<div class="voice-center"><button class="mic-button" type="button" data-action="start-voice" aria-label="开始录音">◉</button><h3>点一下，说出你的问题</h3><p>一次只问一个问题。也可以改用文字输入，不影响继续阅读。</p><button class="secondary" type="button" data-action="voice-text">不方便录音，改用文字</button></div>`;
        } else if (state.voice.stage === "recording") {
          body = `<div class="voice-wait"><div><div class="spinner" style="margin:0 auto 14px"></div><h3>正在录音</h3><p>说完后点击“停止录音”</p><button class="primary" type="button" data-action="stop-voice">停止录音</button></div></div>`;
        } else if (state.voice.stage === "processing") {
          body = `<div class="voice-wait"><div><div class="spinner" style="margin:0 auto 14px"></div><h3>正在听清这个问题</h3><p>识别完成后会先请你确认文字。</p></div></div>`;
        } else if (state.voice.stage === "failure") {
          body = `<div class="voice-error"><strong>没有听清这句话</strong><p>${escapeHtml(state.voice.error || "可以重新录音，也可以直接输入问题。")}</p></div><div class="modal-actions"><button class="primary" type="button" data-action="start-voice">重新录音</button><button class="secondary" type="button" data-action="voice-text">改用文字输入</button></div>`;
        } else if (state.voice.stage === "confirm" || state.voice.stage === "text") {
          body = `<form id="voice-form"><div class="transcript-box"><label for="voice-input">${state.voice.stage === "confirm" ? "识别到的问题" : "输入孩子的问题"}<span>可以修改</span></label><textarea id="voice-input" name="question" placeholder="例如：为什么小兔子想跑走？">${escapeHtml(state.voice.transcript)}</textarea></div><div class="modal-actions"><button class="secondary" type="button" data-action="start-voice">重新录音</button><button class="primary" type="submit">确认并询问知芽</button></div></form>`;
        } else if (state.voice.stage === "answering") {
          body = `<div class="voice-wait"><div><div class="spinner" style="margin:0 auto 14px"></div><h3>知芽正在想一个简短的回答</h3><p>回答会结合当前页面的内容。</p></div></div>`;
        } else if (state.voice.stage === "answer") {
          body = `<div class="transcript-box"><label>孩子的问题<span>已确认</span></label><p style="margin:9px 0 0;font-size:14px;line-height:23px">“${escapeHtml(state.voice.question)}”</p></div><div class="answer-card"><strong>芽 · 知芽的回答</strong><p>${escapeHtml(state.voice.answer)}</p></div><div class="tts-row"><button type="button" data-action="tts">${state.voice.playback === "playing" ? "Ⅱ" : "▶"}</button><div><strong>朗读回答</strong><small>${state.voice.playback === "error" ? "播放失败，文字仍可阅读" : state.voice.playback === "playing" ? "正在播放" : "点击播放"}</small></div></div><div class="modal-actions"><button class="secondary" type="button" data-action="new-question">再问一个</button><button class="primary" type="button" data-action="close-voice">回到绘本</button></div>`;
        }
        return `<div class="modal-backdrop" data-action="voice-backdrop"><section class="modal-card voice-card" role="dialog" aria-modal="true" aria-labelledby="voice-title" data-action="stop-modal"><div class="modal-head"><div><h2 id="voice-title">问知芽</h2><p>${escapeHtml(currentBook().title)} · 第 ${page.no} 页</p></div><button class="modal-close" type="button" data-action="close-voice" aria-label="关闭">×</button></div>${voiceProgress(state.voice.stage)}${body}<p class="modal-note">回答只针对当前页；语音识别失败时可改用文字，不影响继续阅读。</p></section></div>`;
      }

      function accountSidebar() {
        const items = [
          ["overview", "个人中心首页", "⌂"],
          ["profile", "个人资料", "☺"],
          ["children", "儿童档案", "♧"],
          ["shelf", "我的书架", "▤"],
          ["growth", "成长记录", "⌁"],
          ["plan", "阅读计划", "▦"]
        ];
        return `<aside class="account-sidebar">
          <div class="account-person"><div class="account-avatar">沐</div><div><strong>${escapeHtml(state.profile.nickname)}</strong><small>亲子阅读空间</small></div></div>
          <button class="pill child-switch" type="button" data-action="go" data-view="account" data-section="children"><span>${escapeHtml(currentChild().name)} · ${currentChild().age} 岁</span><span>⌄</span></button>
          <nav class="account-nav" aria-label="个人中心功能">
            ${items.map(([key, label, glyph]) => `<button class="account-nav-button ${state.account.section === key ? "active" : ""}" type="button" data-action="account-section" data-section="${key}"><span class="account-nav-icon">${glyph}</span>${label}</button>`).join("")}
          </nav>
          <div class="account-side-note">今天也读一点。<br>每天 15 分钟，和孩子一起慢慢长大。</div>
        </aside>`;
      }

      function accountStats() {
        const childHistory = state.history.filter((item) => item.childId === currentChild().id);
        const readCount = new Set(childHistory.map((item) => item.bookId)).size;
        const minutes = childHistory.reduce((total, item) => total + item.minutes, 0);
        const favorites = state.favorites.length;
        return { childHistory, readCount, minutes, favorites };
      }

      function accountOverview() {
        const { childHistory, readCount, minutes, favorites } = accountStats();
        const recent = childHistory.slice(0, 3);
        const achievements = [
          ["11 月 17 日", `完成了《${bookById(childHistory[0]?.bookId || "guess").title}》的亲子共读`, `${childHistory[0]?.minutes || 0} 分钟 · ${childHistory[0]?.interactions || 0} 次互动`],
          ["11 月 16 日", "连续阅读保持中", "每次共读都会留下新的阅读足迹"],
          ["11 月 14 日", "孩子主动提出了故事问题", "语音问答 · 当前页内容"]
        ];
        return `
          <div class="account-title"><div><h1>个人中心</h1><p>欢迎回来，今天也来陪${escapeHtml(currentChild().name)}读一个好故事吧！</p></div><button class="primary" type="button" data-action="go" data-view="library">去选一本绘本</button></div>
          <section class="account-hero">
            <div class="account-hero-copy"><p class="eyebrow">今天也来陪孩子读一点</p><h1>${escapeHtml(currentChild().name)}的阅读空间</h1><p>${currentChild().interests.join(" · ")} · 以孩子喜欢的故事为起点</p><div class="account-hero-actions"><button class="secondary" type="button" data-action="account-section" data-section="children">切换孩子</button><button class="secondary" type="button" data-action="account-section" data-section="plan">查看阅读计划</button></div></div>
            <div class="hero-illustration"><img src="${assets.rabbitScene}" alt=""></div>
          </section>
          <div class="stats-grid">
            ${statCard("收藏绘本", favorites, "本")}
            ${statCard("已读绘本", readCount, "本")}
            ${statCard("累计阅读", minutes, "分钟")}
            ${statCard("连续阅读", 7, "天")}
          </div>
          <div class="account-grid">
            <section class="account-card"><div class="account-card-head"><div><h2>最近阅读</h2><p>继续上次停下的故事</p></div><button class="text-button" type="button" data-action="account-section" data-section="growth">查看全部 →</button></div>
              <div class="recent-list">${recent.length ? recent.map((item) => recentBook(item)).join("") : `<div class="empty-state"><div><p>还没有阅读记录。</p><button class="primary" type="button" data-action="go" data-view="library">去选一本绘本</button></div></div>`}</div>
            </section>
            <section class="account-card"><div class="account-card-head"><div><h2>今日阅读计划</h2><p>保留一点点亲子时间</p></div></div><div class="plan-metric"><strong>${state.plan.books}</strong><span>本绘本 · ${state.plan.minutes} 分钟</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100, childHistory.filter((item) => isToday(item.date)).length / state.plan.books * 100)}%"></div></div><p class="plan-note">${childHistory.filter((item) => isToday(item.date)).length ? "今天已经完成一次共读。" : "今天还没有开始，选一本孩子喜欢的故事吧。"}</p><button class="secondary" type="button" data-action="account-section" data-section="plan" style="width:100%;margin-top:14px">查看计划</button></section>
          </div>
          <section class="account-card" style="margin-top:16px"><div class="account-card-head"><div><h2>近期成长记录</h2><p>每一次共读，都算数</p></div><button class="text-button" type="button" data-action="account-section" data-section="growth">查看成长记录 →</button></div><div class="activity-list">${achievements.map(([date, title, detail]) => `<div class="activity-row"><time>${date}</time><div><strong>${title}</strong><small>${detail}</small></div></div>`).join("")}</div></section>`;
      }

      function statCard(label, value, unit) {
        return `<article class="stat-card"><span>${label}</span><strong>${value}</strong><small>${unit} · 当前孩子数据</small></article>`;
      }

      function recentBook(item) {
        const book = bookById(item.bookId);
        return `<button class="recent-book" type="button" data-action="open-detail" data-id="${book.id}"><span class="recent-cover">${coverImage(book)}</span><span><strong>${escapeHtml(book.title)}</strong><small>${formatDate(item.date)} · 阅读 ${item.minutes} 分钟</small></span></button>`;
      }

      function accountProfile() {

le)}</strong><small>阅读 ${item.minutes} 分钟 · ${item.interactions} 次互动</small></div><span class="pill">已读</span></div>`; }).join("")}</div>` : `<div class="empty-state"><div><h2>还没有阅读记录</h2><p>完成一次亲子共读后，阅读摘要会显示在这里。</p><button class="primary" type="button" data-action="go" data-view="library">去选一本绘本</button></div></div>`}</section>`;

      function accountPlan() {
        const records = state.history.filter((item) => item.childId === currentChild().id);
        const calendar = buildCalendar(records);
        const completedDays = new Set(records.map((item) => item.date.slice(0, 10))).size;
        return `<div class="account-title"><div><h1>阅读计划</h1><p>把每天的共读变成轻松、可持续的小习惯。</p></div><button class="primary" type="button" data-action="open-plan-editor">设置计划</button></div><div class="plan-layout"><section class="today-plan-card"><p class="eyebrow">✦ 今日阅读计划</p><h2>今天读 ${state.plan.books} 本绘本</h2><p class="address">目标时长 ${state.plan.minutes} 分钟 · 每周 ${state.plan.weekly} 天</p><div class="progress-track" style="margin-top:18px"><div class="progress-fill" style="width:${Math.min(100, (records.filter((item) => isToday(item.date)).length / state.plan.books) * 100)}%"></div></div><div class="plan-recommend"><img src="${books[4].cover}" alt=""><div><strong>${books[4].title}</strong><small>今天可以从这本书开始</small></div></div><button class="primary" type="button" data-action="start-reading" data-id="${books[4].id}" style="width:100%;margin-top:16px">开始阅读</button><p class="plan-note">计划完成情况按当前孩子的本地阅读记录计算。</p></section><section class="account-card calendar-card"><div class="calendar-head"><h2>2026 年 11 月</h2><div class="calendar-nav"><button class="round-button" type="button" data-action="show-calendar-feedback">‹</button><button class="round-button" type="button" data-action="show-calendar-feedback">›</button></div></div><div class="calendar-grid"><span class="calendar-weekday">一</span><span class="calendar-weekday">二</span><span class="calendar-weekday">三</span><span class="calendar-weekday">四</span><span class="calendar-weekday">五</span><span class="calendar-weekday">六</span><span class="calendar-weekday">日</span>${calendar.map((day) => day ? `<button class="calendar-day ${records.some((item) => item.date.slice(0, 10) === day.key) ? "done" : ""}" type="button" data-action="calendar-day" data-date="${day.key}">${day.number}</button>` : `<span class="calendar-day empty"></span>`).join("")}</div></section></div><section class="account-card plan-settings-card"><div class="account-card-head"><div><h2>计划设置</h2><p>目标可以随孩子的节奏调整。</p></div><button class="secondary" type="button" data-action="open-plan-editor">编辑计划</button></div><div class="plan-setting-row"><span>每日阅读绘本</span><strong>${state.plan.books} 本</strong></div><div class="plan-setting-row"><span>每日阅读时长</span><strong>${state.plan.minutes} 分钟</strong></div><div class="plan-setting-row"><span>每周阅读目标</span><strong>${state.plan.weekly} 天</strong></div><div class="completion-grid"><div><span>本周完成</span><strong>${Math.min(state.plan.weekly, completedDays)} 次</strong></div><div><span>本月完成</span><strong>${completedDays} 天</strong></div><div><span>目标完成率</span><strong>${state.plan.weekly ? Math.min(100, Math.round(completedDays / state.plan.weekly * 100)) : 0}%</strong></div></div></section>`;
      }

      function buildCalendar(records) {
        const year = 2026;
        const month = 10;
        const firstDay = new Date(year, month, 1);
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const offset = (firstDay.getDay() + 6) % 7;
        const cells = Array.from({ length: offset }, () => null);
        for (let day = 1; day <= daysInMonth; day += 1) {
          const key = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          cells.push({ number: day, key });
        }
        return cells;
      }

      function accountPage() {
        const sections = {
          overview: accountOverview,
          profile: accountProfile,
          children: accountChildren,
          shelf: accountShelf,

        };
        return `${header("account")}<main class="page"><div class="page-width account-layout">${accountSidebar()}<section class="account-main">${(sections[state.account.section] || accountOverview)()}</section></div></main>${state.account.childEditor !== null ? childEditorModal() : ""}${state.account.deleteId ? deleteModal() : ""}${state.account.planEditor ? planEditorModal() : ""}`;

      function childEditorModal() {

        return `<div class="modal-backdrop" data-action="stop-modal"><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="child-editor-title"><div class="modal-head"><div><h2 id="child-editor-title">${isNew ? "添加孩子" : "编辑儿童档案"}</h2><p>这些信息只用于推荐和阅读计划。</p></div><button class="modal-close" type="button" data-action="close-child-editor" aria-label="关闭">×</button></div><form id="child-form"><div class="form-field"><label for="child-name">昵称</label><input id="child-name" name="name" value="${escapeHtml(draft.name || "")}" required></div><div class="form-field"><label for="child-birthday">出生日期</label><input id="child-birthday" name="birthday" type="date" value="${escapeHtml(draft.birthday || "2022-03-18")}"></div><div class="form-field"><label for="child-gender">性别（可选）</label><select id="child-gender" name="gender"><option value="">未填写</option><option value="女" ${draft.gender === "女" ? "selected" : ""}>女</option><option value="男" ${draft.gender === "男" ? "selected" : ""}>男</option></select></div><div class="form-field"><label>兴趣偏好</label><div class="interest-picker">${["动物", "自然", "冒险", "童话", "友谊"].map((tag) => `<button class="interest-option ${draft.interests.includes(tag) ? "selected" : ""}" type="button" data-action="toggle-child-interest" data-value="${tag}">${tag}</button>`).join("")}</div></div><div class="modal-actions"><button class="secondary" type="button" data-action="close-child-editor">取消</button><button class="primary" type="submit">保存档案</button></div></form></section></div>`;

      function deleteModal() {
        const child = state.children.find((item) => item.id === state.account.deleteId);
        return `<div class="modal-backdrop" data-action="stop-modal"><section class="modal-card confirm-card" role="dialog" aria-modal="true" aria-labelledby="delete-title"><div class="modal-head"><div class="warning-icon">!</div><div><h2 id="delete-title">确认删除${escapeHtml(child?.name || "孩子")}的档案？</h2><p>删除后，这个孩子的书架、阅读记录和计划将不再关联，此操作无法恢复。</p></div></div><div class="modal-actions"><button class="secondary" type="button" data-action="close-delete">保留档案</button><button class="danger" type="button" data-action="confirm-delete" data-id="${state.account.deleteId}">确认删除</button></div></section></div>`;
      }

      function planEditorModal() {
        const draft = state.planDraft || state.plan;
        return `<div class="modal-backdrop" data-action="stop-modal"><section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="plan-editor-title"><div class="modal-head"><div><h2 id="plan-editor-title">设置阅读计划</h2><p>计划会随当前孩子同步更新。</p></div><button class="modal-close" type="button" data-action="close-plan-editor" aria-label="关闭">×</button></div><form id="plan-form"><div class="form-field"><label for="plan-books">每日阅读绘本数量</label><input id="plan-books" name="books" type="number" min="1" max="5" value="${draft.books}"></div><div class="form-field"><label for="plan-minutes">每日阅读时长（分钟）</label><input id="plan-minutes" name="minutes" type="number" min="5" max="60" step="5" value="${draft.minutes}"></div><div class="form-field"><label for="plan-weekly">每周阅读目标（天）</label><input id="plan-weekly" name="weekly" type="number" min="1" max="7" value="${draft.weekly}"></div><div class="modal-actions"><button class="secondary" type="button" data-action="close-plan-editor">取消</button><button class="primary" type="submit">保存计划</button></div></form></section></div>`;
      }

      function formatDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return "刚刚";
        return new Intl.DateTimeFormat("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }).format(date);
      }

      function carouselOffset(index, selectedIndex, count) {
        let offset = index - selectedIndex;
        if (offset > count / 2) offset -= count;
        if (offset < -count / 2) offset += count;
        return offset;
      }

      function carouselSpec(offset, baseWidth, panelWidth) {
        const distance = Math.abs(offset);
        const direction = Math.sign(offset);
        if (distance === 0) {
          return {
            x: 0,
            y: baseWidth * .03,
            z: 55,
            scale: 1.08,
            rotateY: 0,
            opacity: 1,
            layer: 90,
            filter: "saturate(1) brightness(1)"
          };
        }
        if (distance === 1) {
          return {
            x: direction * panelWidth * .22,
            y: baseWidth * .09,
            z: 10,
            scale: .68,
            rotateY: -direction * 15,
            opacity: .7,
            layer: 60,
            filter: "saturate(.82) brightness(.98)"
          };
        }
        if (distance === 2) {
          return {
            x: direction * panelWidth * .38,
            y: baseWidth * .18,
            z: -40,
            scale: .46,
            rotateY: -direction * 25,
            opacity: .28,
            layer: 30,
            filter: "saturate(.68) brightness(.92)"
          };
        }
        return {
          x: direction * panelWidth * .48,
          y: baseWidth * .24,
          z: -80,
          scale: .4,
          rotateY: -direction * 30,
          opacity: 0,
          layer: 10,
          filter: "saturate(.62) brightness(.9)"
        };
      }

      function carouselTransform(spec) {
        return `translate(-50%, -50%) translate3d(${spec.x}px, ${spec.y}px, ${spec.z}px) rotateY(${spec.rotateY}deg) scale(${spec.scale})`;
      }

      function applyCarouselCard(card, spec, offset) {
        const hidden = Math.abs(offset) > 2;
        card.style.setProperty("--wheel-x", `${spec.x}px`);
        card.style.setProperty("--wheel-y", `${spec.y}px`);
        card.style.setProperty("--wheel-z", `${spec.z}px`);
        card.style.setProperty("--wheel-scale", String(spec.scale));
        card.style.setProperty("--wheel-rotate-y", `${spec.rotateY}deg`);
        card.style.setProperty("--wheel-opacity", String(spec.opacity));
        card.style.setProperty("--wheel-layer", String(spec.layer));
        card.style.setProperty("--wheel-filter", spec.filter);
        card.classList.toggle("is-center", offset === 0);
        card.classList.toggle("is-side", Math.abs(offset) === 1 || Math.abs(offset) === 2);
        card.classList.toggle("is-hidden", hidden);
        card.tabIndex = hidden ? -1 : 0;
        card.setAttribute("aria-hidden", hidden ? "true" : "false");
        card.style.pointerEvents = hidden ? "none" : "auto";
      }

      function layoutLibraryWheel() {
        const wheel = document.querySelector(".book-wheel");
        if (!wheel) return;
        const cards = [...wheel.querySelectorAll(".wheel-book")];
        if (!cards.length) return;
        const selectedIndex = cards.findIndex((card) => card.classList.contains("selected"));
        if (selectedIndex < 0) return;
        const baseWidth = cards[0].offsetWidth;
        const panelWidth = wheel.offsetWidth;
        cards.forEach((card, index) => {
          const offset = carouselOffset(index, selectedIndex, cards.length);
          applyCarouselCard(card, carouselSpec(offset, baseWidth, panelWidth), offset);
        });
      }

      function animateLibraryWheel(fromBookId) {
        const wheel = document.querySelector(".book-wheel");
        if (!wheel || !fromBookId) return;
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        const cards = [...wheel.querySelectorAll(".wheel-book")];
        const selectedIndex = cards.findIndex((card) => card.classList.contains("selected"));
        const previousIndex = cards.findIndex((card) => card.dataset.id === fromBookId);
        if (selectedIndex < 0 || previousIndex < 0) return;
        const baseWidth = cards[0].offsetWidth;
        const panelWidth = wheel.offsetWidth;
        cards.forEach((card, index) => {
          const fromOffset = carouselOffset(index, previousIndex, cards.length);
          const toOffset = carouselOffset(index, selectedIndex, cards.length);
          const from = carouselSpec(fromOffset, baseWidth, panelWidth);
          const to = carouselSpec(toOffset, baseWidth, panelWidth);
          card.animate(
            [
              {
                transform: carouselTransform(from),
                opacity: String(from.opacity),
                filter: from.filter
              },
              {
                transform: carouselTransform(to),
                opacity: String(to.opacity),
                filter: to.filter
              }
            ],
            { duration: 680, easing: "cubic-bezier(.22, .72, .2, 1)" }
          );
        });
      }

      function isToday(value) {
        const date = new Date(value);
        const now = new Date();
        return date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth() && date.getDate() === now.getDate();
      }

      function updateReaderPageUI(index) {
        const book = currentBook();
        const storyPages = pagesFor(book);
        const nextIndex = Math.max(0, Math.min(storyPages.length - 1, index));
        const page = storyPages[nextIndex];
        state.reader.pageIndex = nextIndex;
        const progress = document.querySelector("[data-reader-progress]");
        if (progress) progress.textContent = `第 ${page.no} / ${book.pages} 页 · 与孩子一起慢慢读`;
        const question = document.querySelector("[data-reader-question]");
        if (question) question.textContent = page.question;
        const tip = document.querySelector("[data-reader-tip]");
        if (tip) tip.textContent = page.answer;
        const audioSlot = document.querySelector("[data-reader-audio-slot]");
        if (audioSlot) audioSlot.innerHTML = readerAudioNotice(page);
        const feedbackSlot = document.querySelector("[data-reader-feedback-slot]");
        if (feedbackSlot) feedbackSlot.innerHTML = readerFeedbackNotice();
        const previous = document.querySelector("[data-reader-prev]");
        if (previous) previous.disabled = nextIndex === 0;
        const next = document.querySelector("[data-reader-next]");
        if (next) {
          const isLast = nextIndex >= storyPages.length - 1;
          next.dataset.action = isLast ? "finish-reading" : "next-page";
          next.innerHTML = `<span class="dock-glyph">${isLast ? "✓" : "›"}</span>${isLast ? "完成" : "下一页"}`;
        }
        try {
          history.replaceState(null, "", `${location.pathname}${location.search}#reader/${book.id}/${nextIndex + 1}`);
        } catch {}
      }

      function mountReaderFlip() {
        if (state.view !== "reader" || state.reader.loading || !window.OpenPageFlip) return;
        const container = document.getElementById("zhiya-flipbook");
        if (!container) return;
        const book = currentBook();
        const storyPages = pagesFor(book);
        const startPage = Math.max(0, Math.min(storyPages.length - 1, state.reader.pageIndex)) * 2;
        try {
          activeReaderFlip = window.OpenPageFlip.createBook(container, {
            width: 420,
            height: 560,
            size: "stretch",
            minWidth: 240,
            maxWidth: 460,
            layout: "auto",
            cover: false,
            startPage,
            flipDuration: 920,
            easing: (progress) => 1 - ((1 - progress) ** 3),
            shadows: true,
            shadowOpacity: .3,
            drag: true,
            swipe: true,
            hover: true,
            click: "edges"
          });
          activeReaderFlip.on("flip", ({ page }) => {
            const storyIndex = Math.max(0, Math.min(storyPages.length - 1, Math.floor(page / 2)));
            if (storyIndex === state.reader.pageIndex) return;
            stopSpeech();
            state.reader.audio = "idle";
            state.reader.feedback = "";
            updateReaderPageUI(storyIndex);
          });
          activeReaderFlip.on("changeOrientation", () => {
            requestAnimationFrame(() => activeReaderFlip?.redraw());
          });
        } catch (error) {
          activeReaderFlip = null;
          console.error("OpenPageFlip failed to initialise", error);
        }
      }

      function render() {
        if (activeReaderFlip) {
          activeReaderFlip.destroy();
          activeReaderFlip = null;
        }
        document.body.dataset.view = state.view;
        const views = { home: homePage, library: libraryPage, detail: detailPage, reader: readerPage, account: accountPage };
        app.innerHTML = (views[state.view] || homePage)();
        window.__zhiyaImageError = () => { state.readerImageError = true; render(); };
        if (state.view === "library") {
          requestAnimationFrame(() => {
            layoutLibraryWheel();
            if (state.libraryMotionFrom !== null) {
              animateLibraryWheel(state.libraryMotionFrom);
              state.libraryMotionFrom = null;
            }
          });
        }
        if (state.voice.open) {
          requestAnimationFrame(() => document.getElementById("voice-input")?.focus());
        }
        if (state.view === "reader" && !state.reader.loading) {
          requestAnimationFrame(mountReaderFlip);
        }
      }

      function switchChild(id) {
        if (!state.children.some((child) => child.id === id)) return;
        state.account.childId = id;
        save();
        render();
        showToast(`已切换到${currentChild().name}的阅读空间`);
      }

      function openDetail(id) {
        state.selectedBookId = id;
        setView("detail", { hash: `detail/${id}` });
      }

      function startReading(id = state.selectedBookId) {
        state.selectedBookId = id;
        state.reader.pageIndex = 0;
        state.reader.feedback = "";
        state.reader.completed = false;
        state.readerImageError = false;
        setView("reader", { bookId: id, hash: `reader/${id}/1` });
      }

      function cycleWheel(direction) {
        const list = filteredBooks();
        if (!list.length) return;
        const currentId = state.selectedBookId;
        const index = Math.max(0, list.findIndex((book) => book.id === currentId));
        const nextBook = list[(index + direction + list.length) % list.length];
        if (!nextBook || nextBook.id === currentId) return;
        state.libraryMotionFrom = currentId;
        state.selectedBookId = nextBook.id;
        render();
      }

      function answerForCurrentPage(question) {
        const page = pagesFor(currentBook())[state.reader.pageIndex] || pagesFor(currentBook())[0];
        const text = question.trim();
        if (/妈妈|为什么|离开|跑/.test(text)) return page.answer;
        return `${page.answer} 你也可以再问一个和画面有关的问题。`;
      }

      function stopSpeech() {
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      }

      function narration() {
        if (state.reader.audio === "playing") {
          stopSpeech();
          state.reader.audio = "paused";
          render();
          return;
        }
        if (!("speechSynthesis" in window)) {
          state.reader.audio = "error";
          render();
          showToast("当前浏览器不支持语音播放，文字仍可阅读");
          return;
        }
        stopSpeech();
        const utterance = new SpeechSynthesisUtterance(pagesFor(currentBook())[state.reader.pageIndex].text);
        utterance.lang = "zh-CN";
        utterance.rate = .92;
        utterance.onend = () => { state.reader.audio = "idle"; if (state.view === "reader") render(); };
        utterance.onerror = () => { state.reader.audio = "error"; if (state.view === "reader") render(); };
        state.reader.audio = "playing";
        window.speechSynthesis.speak(utterance);
        render();
      }

      function beginVoice() {
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Recognition) {
          state.voice.stage = "failure";
          state.voice.error = "浏览器没有提供语音识别能力，可以改用文字输入。";
          render();
          return;
        }
        try {
          const recognition = new Recognition();
          recognition.lang = "zh-CN";
          recognition.interimResults = false;
          recognition.maxAlternatives = 1;
          recognition.onresult = (event) => {
            state.voice.transcript = event.results[0][0].transcript || "";
            state.voice.stage = "confirm";
            render();
          };
          recognition.onerror = () => {
            state.voice.stage = "failure";
            state.voice.error = "没有听清这句话，可以重试或直接输入文字。";
            render();
          };
          recognition.onend = () => {
            if (state.voice.stage === "recording") {
              state.voice.stage = "failure";
              state.voice.error = "录音结束但没有识别到内容。";
              render();
            }
          };
          state.voice.recognition = recognition;
          state.voice.stage = "recording";
          recognition.start();
          render();
        } catch {
          state.voice.stage = "failure";
          state.voice.error = "麦克风暂时不可用，可以改用文字输入。";
          render();
        }
      }

      function stopVoice() {
        try { state.voice.recognition?.stop(); } catch {}
        if (state.voice.stage === "recording") {
          state.voice.stage = "processing";
          render();
          setTimeout(() => {
            if (state.voice.stage === "processing") {
              state.voice.stage = "confirm";
              state.voice.transcript = state.voice.transcript || "为什么故事里的人物会这样选择？";
              render();
            }
          }, 650);
        }
      }

      function confirmVoice(question) {
        const text = question.trim();
        if (!text) { showToast("请先写下或说出一个问题"); return; }
        state.voice.question = text;
        state.voice.transcript = text;
        state.voice.stage = "answering";
        render();
        setTimeout(() => {
          state.voice.answer = answerForCurrentPage(text);
          state.voice.stage = "answer";
          state.voice.playback = "idle";
          recordReadingInteraction();
          render();
        }, 650);
      }

      function recordReadingInteraction() {
        const book = currentBook();
        const childId = state.account.childId;
        const today = new Date().toISOString();
        const existing = state.history.find((item) => item.childId === childId && item.bookId === book.id && isToday(item.date));
        if (existing) {
          existing.interactions += 1;
        } else {
          state.history.unshift({ id: `h-${Date.now()}`, childId, bookId: book.id, date: today, minutes: 1, pages: 1, interactions: 1 });
        }
        save();
      }

      function playAnswer() {
        if (state.voice.playback === "playing") {
          stopSpeech();
          state.voice.playback = "idle";
          render();
          return;
        }
        if (!("speechSynthesis" in window)) {
          state.voice.playback = "error";
          render();
          return;
        }
        stopSpeech();
        const utterance = new SpeechSynthesisUtterance(state.voice.answer);
        utterance.lang = "zh-CN";
        utterance.rate = .94;
        utterance.onend = () => { state.voice.playback = "idle"; if (state.voice.open) render(); };
        utterance.onerror = () => { state.voice.playback = "error"; if (state.voice.open) render(); };
        state.voice.playback = "playing";
        window.speechSynthesis.speak(utterance);
        render();
      }

      function finishReading() {
        state.reader.completed = true;
        recordReadingInteraction();
        render();
        showToast("这一本读完了，阅读记录已保存");
      }

      function saveProfile(form) {
        const data = new FormData(form);
        state.profile.nickname = String(data.get("nickname") || "").trim() || state.profile.nickname;
        state.profile.signature = String(data.get("signature") || "").trim();
        save();
        render();
        showToast("个人资料已保存");
      }

      function saveChild(form) {
        const data = new FormData(form);
        const draft = state.account.childEditor;
        const interests = draft?.interests || [];
        const child = {
          id: draft?.id || `child-${Date.now()}`,
          name: String(data.get("name") || "宝贝").trim(),
          birthday: String(data.get("birthday") || "2022-01-01"),
          gender: String(data.get("gender") || ""),
          interests: interests.length ? interests : ["动物"],
          color: draft?.color || "#e8d4be"
        };
        child.age = Math.max(0, new Date().getFullYear() - Number(child.birthday.slice(0, 4)));
        const index = state.children.findIndex((item) => item.id === child.id);
        if (index >= 0) state.children[index] = child; else state.children.push(child);
        state.account.childId = child.id;
        state.account.childEditor = null;
        save();
        render();
        showToast("儿童档案已保存");
      }

      function deleteChild(id) {
        state.children = state.children.filter((child) => child.id !== id);
        state.account.deleteId = null;
        if (!state.children.length) state.children = [childSeeds[0]];
        state.account.childId = state.children[0].id;
        save();
        render();
        showToast("儿童档案已删除");
      }

      function savePlan(form) {
        const data = new FormData(form);
        state.plan = {
          books: Math.max(1, Number(data.get("books") || 1)),
          minutes: Math.max(5, Number(data.get("minutes") || 15)),
          weekly: Math.max(1, Math.min(7, Number(data.get("weekly") || 5)))
        };
        state.account.planEditor = false;
        save();
        render();
        showToast("阅读计划已更新");
      }

      document.addEventListener("submit", (event) => {
        if (event.target.id === "search-form") {
          event.preventDefault();
          state.librarySearch = document.getElementById("search-input").value.trim();
          state.libraryReady = true;
          setView("library", { hash: "library" });
        }
        if (event.target.id === "voice-form") {
          event.preventDefault();
          confirmVoice(new FormData(event.target).get("question") || "");
        }
        if (event.target.id === "profile-form") {
          event.preventDefault();
          saveProfile(event.target);
        }
        if (event.target.id === "child-form") {
          event.preventDefault();
          saveChild(event.target);
        }
        if (event.target.id === "plan-form") {
          event.preventDefault();
          savePlan(event.target);
        }
      });

      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");
        if (!target) return;
        const action = target.dataset.action;
        if (action === "stop-modal") { event.stopPropagation(); return; }
        if (action === "voice-backdrop") { if (event.target === target) { state.voice.open = false; render(); } return; }
        if (action === "go") {
          const view = target.dataset.view;
          if (view === "account" && target.dataset.section) state.account.section = target.dataset.section;
          setView(view, { hash: view === "account" ? `account/${state.account.section}` : view });
          return;
        }
        if (action === "open-detail") { openDetail(target.dataset.id); return; }
        if (action === "start-reading") { startReading(target.dataset.id); return; }
        if (action === "toggle-favorite") {
          const id = target.dataset.id;
          state.favorites = state.favorites.includes(id) ? state.favorites.filter((item) => item !== id) : [...state.favorites, id];
          save(); render(); showToast(state.favorites.includes(id) ? "已加入书架" : "已取消收藏"); return;
        }
        if (action === "select-book") {
          if (target.dataset.id === state.selectedBookId) return;
          state.libraryMotionFrom = state.selectedBookId;
          state.selectedBookId = target.dataset.id;
          render();
          return;
        }
        if (action === "library-category") {
          const category = target.dataset.value;
          state.libraryMotionFrom = state.selectedBookId;
          if (category === "全部" || state.libraryCategory === category) {
            state.libraryCategory = "全部";
            state.libraryOption = null;
          } else {
            state.libraryCategory = category;
            state.libraryOption = null;
          }
          render();
          return;
        }
        if (action === "library-option") {
          state.libraryMotionFrom = state.selectedBookId;
          state.libraryOption = target.dataset.value === "全部" ? null : target.dataset.value;
          render();
          return;
        }
        if (action === "clear-library") {
          state.libraryMotionFrom = state.selectedBookId;
          state.libraryCategory = "全部";
          state.libraryOption = null;
          state.librarySearch = "";
          render();
          return;
        }
        if (action === "shelf-prev" || action === "shelf-next") {
          const index = Math.max(0, books.findIndex((bookItem) => bookItem.id === state.selectedBookId));
          state.shelfMotion = action === "shelf-next" ? "next" : "prev";
          state.selectedBookId = books[(index + (action === "shelf-next" ? 1 : -1) + books.length) % books.length].id;
          render();
          window.setTimeout(() => { state.shelfMotion = null; }, 340);
          return;
        }
        if (action === "wheel-prev") { cycleWheel(-1); return; }
        if (action === "wheel-next") { cycleWheel(1); return; }
        if (action === "prev-page" || action === "next-page") {
          if (activeReaderFlip) {
            if (action === "prev-page") activeReaderFlip.flipPrev();
            else activeReaderFlip.flipNext();
            return;
          }
          const book = currentBook();
          state.reader.pageIndex = Math.max(0, Math.min(book.pages - 1, state.reader.pageIndex + (action === "next-page" ? 1 : -1)));
          state.reader.feedback = "";
          render();
          return;
        }
        if (action === "narration") { narration(); return; }
        if (action === "reader-feedback") { state.reader.feedback = target.dataset.value; render(); return; }
        if (action === "finish-reading") { finishReading(); return; }
        if (action === "retry-image") { state.readerImageError = false; render(); return; }
        if (action === "open-voice") { state.voice = { ...state.voice, open: true, stage: "idle", transcript: "", question: "", answer: "", playback: "idle", error: "" }; render(); return; }
        if (action === "close-voice") { stopVoice(); stopSpeech(); state.voice.open = false; render(); return; }
        if (action === "start-voice") { beginVoice(); return; }
        if (action === "stop-voice") { stopVoice(); return; }
        if (action === "voice-text") { state.voice.stage = "text"; render(); return; }
        if (action === "tts") { playAnswer(); return; }
        if (action === "new-question") { state.voice.stage = "idle"; state.voice.question = ""; state.voice.answer = ""; state.voice.transcript = ""; state.voice.playback = "idle"; render(); return; }
        if (action === "account-section") { state.account.section = target.dataset.section; setView("account", { hash: `account/${state.account.section}` }); return; }
        if (action === "profile-feedback") { showToast("当前为原型演示，正式版本会在这里打开对应设置"); return; }
        if (action === "logout") { state.voice.open = false; setView("home", { hash: "home" }); showToast("已退出当前演示账号"); return; }
        if (action === "add-child") { state.account.childEditor = { id: "", name: "", birthday: "2022-03-18", gender: "", interests: [], color: "#e8d4be" }; render(); return; }
        if (action === "edit-child") { const child = state.children.find((item) => item.id === target.dataset.id); state.account.childEditor = { ...child, interests: [...child.interests] }; render(); return; }
        if (action === "select-child") { switchChild(target.dataset.id); return; }
        if (action === "delete-child") { state.account.deleteId = target.dataset.id; render(); return; }
        if (action === "close-child-editor") { state.account.childEditor = null; render(); return; }
        if (action === "close-delete") { state.account.deleteId = null; render(); return; }
        if (action === "confirm-delete") { deleteChild(target.dataset.id); return; }
        if (action === "toggle-child-interest") {
          const value = target.dataset.value;
          const draft = state.account.childEditor;
          draft.interests = draft.interests.includes(value) ? draft.interests.filter((item) => item !== value) : [...draft.interests, value];
          render();
          return;
        }
        if (action === "shelf-filter") { state.account.shelfFilter = target.dataset.value; render(); return; }
        if (action === "open-plan-editor") { state.planDraft = { ...state.plan }; state.account.planEditor = true; render(); return; }
        if (action === "close-plan-editor") { state.account.planEditor = false; state.planDraft = null; render(); return; }
        if (action === "show-filter-feedback") { showToast("当前原型已切换筛选条件，正式版本会更新趋势数据"); return; }
        if (action === "show-calendar-feedback") { showToast("当前原型演示月历切换，正式版本会加载对应月份数据"); return; }
        if (action === "calendar-day") {
          const date = target.dataset.date;
          const records = state.history.filter((item) => item.childId === currentChild().id && item.date.slice(0, 10) === date);
          showToast(records.length ? `当天完成 ${records.length} 次阅读` : "当天暂无阅读记录");
          return;
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key !== "Escape") return;
        if (state.voice.open) { state.voice.open = false; stopSpeech(); render(); return; }
        if (state.account.childEditor !== null) { state.account.childEditor = null; render(); return; }
        if (state.account.deleteId) { state.account.deleteId = null; render(); return; }
        if (state.account.planEditor) { state.account.planEditor = false; render(); }
      });

      window.addEventListener("hashchange", () => {
        const nextView = parseHash();
        setView(nextView, { hash: location.hash.replace(/^#/, "") });
      });

      window.addEventListener("resize", () => {
        if (state.view !== "library") return;
        window.requestAnimationFrame(layoutLibraryWheel);
      });

      state.view = parseHash();
      if (state.view === "library") {
        state.libraryLoading = true;
        setTimeout(() => { state.libraryLoading = false; state.libraryReady = true; render(); }, 260);
      } else if (state.view === "reader") {
        state.reader.loading = true;
        setTimeout(() => { state.reader.loading = false; render(); }, 180);
      }
      render();
    })();
  </script>
</body>
</html>
